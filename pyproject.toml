[tool.poetry]
packages = [{ include = "fastsio", from = "src" }]

[project]
name = "fastsio"
version = "0.4.0"
description = "High-performance Socket.IO for Python with a Rust transport core"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Miguel Grinberg", email = "miguel.grinberg@gmail.com" },
  { name = "Konstantin Ponomarev", email = "cicwak@gmail.com" },
]
dependencies = [
  "bidict>=0.21.0",
  "python-engineio>=4.12.2,<5.0.0",
  "pydantic>=2.11.7,<3.0.0",
  "msgpack>=1.1.1,<2.0.0",
]

[project.optional-dependencies]
client = ["requests>=2.21.0", "websocket-client>=0.54.0"]
asyncio-client = ["aiohttp>=3.4"]
docs = ["sphinx"]

[project.urls]
Homepage = "https://github.com/cicwak/fastsio"
Repository = "https://github.com/cicwak/fastsio"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
requests = "^2.32.5"
uvicorn = "^0.35.0"
pytest-asyncio = "^1.1.0"
maturin = "^1.14.1"
aiohttp = "^3.12.15"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "fastsio._rust"
features = ["pyo3/extension-module"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_calls = false
exclude = "(venv|migrations|start_service\\.dist|start_service\\.build|start_service\\.onefile-build)"

[tool.ruff]
line-length = 88
exclude = [
    "migrations",
    "venv",
    "tests",
    "examples",
    "docs",
]


[tool.ruff.lint]
select = [
  "F", "E", "W", "I", "UP", "N", "Q",
  "B", "BLE", "ARG", "SIM", "C4", "PERF",
  "A", "DTZ", "TCH", "TRY",
  "RUF", "D", "ANN",
  "RET", "RSE", "TID",
]
# Столкновения стилей докстрингов: выберем Google и заглушим конфликтующие правила
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["fastsio"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "pydantic.validator",
    "declared_attr",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Тестам позволяем послабления: assert, отсутствие докстрингов и Any
"tests/**" = ["S101", "D", "ANN401", "ARG002", "PT009", "PT011"]
# В __init__ обычно реэкспорт, без докстрингов — не ругаемся
"**/__init__.py" = ["D104", "F401"]
# Скрипты/пример использования (если есть): можно Any и без докстрингов
"examples/**" = ["D", "ANN401"]
