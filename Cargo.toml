[package]
name = "fastsio"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Rust protocol codecs for fastsio"

[lib]
name = "fastsio_rust"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
base64 = "0.22.1"
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }
pythonize = { version = "0.29.0", features = ["serde_json", "arbitrary_precision"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
