[package]
name = "fastsio"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "High-performance Rust transport and protocol core for fastsio"

[lib]
name = "fastsio_rust"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pythonize = { version = "0.29.0", features = ["serde_json", "arbitrary_precision"] }
serde = "1.0"
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
socketioxide = "0.18.6"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread"] }

[features]
native-benchmark = []

[[bin]]
name = "fastsio-native-benchmark"
path = "rust/bin/native_benchmark.rs"
required-features = ["native-benchmark"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
